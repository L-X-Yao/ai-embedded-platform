name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Always-run: static audit + documentation drift ----

  wheel-audit:
    name: wheel audit (63 checks) + doc drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit wheels
        run: python3 tooling/audit/audit_wheels.py

      - name: Check documentation drift
        run: python3 tooling/audit/doc_drift_check.py

  spdx-check:
    name: SPDX license headers
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check SPDX headers in wheel sources
        run: |
          MISSING=0
          while IFS= read -r f; do
            if ! head -10 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "::error file=$f::Missing SPDX-License-Identifier header"
              MISSING=$((MISSING + 1))
            fi
          done < <(find wheels -name '*.c' -o -name '*.h' | grep -v '/build/' | sort)
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING files missing SPDX license headers"
            exit 1
          fi
          echo "All wheel source files have SPDX headers"

  # ---- Change detection: full run on first push / dispatch / harness change,
  #      incremental matrix otherwise ----

  detect-changes:
    name: detect changed wheels
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      full-run: ${{ steps.detect.outputs.full_run }}
      wheel-matrix: ${{ steps.detect.outputs.matrix }}
      has-wheels: ${{ steps.detect.outputs.has_wheels }}
      log-changed: ${{ steps.detect.outputs.log_changed }}
      crc16-changed: ${{ steps.detect.outputs.crc16_changed }}
      examples-changed: ${{ steps.detect.outputs.examples_changed }}
      wheels-touched: ${{ steps.detect.outputs.wheels_touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE=""
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            # The last commit that passed, not github.event.before: a pending
            # run cancelled by a newer push tested nothing, and the changes of
            # a failed run still need a pass. No answer means a full run.
            BASE=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || echo "")
          fi

          # First push to a branch (0000...), force-push or unknown sha -> full run
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          elif [ -n "$BASE" ] && ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=""
          fi

          CHANGED=""
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "")
          fi

          FULL="false"
          if [ -z "$BASE" ] || echo "$CHANGED" | grep -qE "^tooling/(test|audit|harness|codegen)/|^\.github/"; then
            FULL="true"
          fi

          MATRIX="[]"
          HAS="false"
          COUNT=0
          if [ "$FULL" = "false" ]; then
            ENTRIES=""
            for test_cmake in wheels/*/*/test/CMakeLists.txt; do
              wheel_dir=$(dirname "$(dirname "$test_cmake")")
              name=$(basename "$wheel_dir")
              test_dir="${wheel_dir}/test"

              # log and crc16 have standalone pytest jobs
              [ "$name" = "log" ] && continue
              [ "$name" = "crc16" ] && continue

              INCLUDE=false
              if echo "$CHANGED" | grep -q "^${wheel_dir}/"; then
                INCLUDE=true
              else
                # Upstream deps named in test/CMakeLists.txt. Paths come as ../../NAME,
                # ../../../LAYER/NAME and ../../../../wheels/LAYER/NAME, so resolve them.
                for rel in $(grep -oE '(\.\./)+[A-Za-z0-9_/.-]+' "$test_cmake" 2>/dev/null | sort -u); do
                  upstream=$(realpath -m --relative-to=. "$test_dir/$rel" | cut -d/ -f1-3)
                  case "$upstream" in wheels/*/*) ;; *) continue ;; esac
                  [ "$upstream" = "$wheel_dir" ] && continue
                  if echo "$CHANGED" | grep -q "^${upstream}/"; then
                    INCLUDE=true
                    break
                  fi
                done
              fi

              if [ "$INCLUDE" = "true" ]; then
                ENTRIES="${ENTRIES}{\"name\":\"$name\",\"dir\":\"$test_dir\"},"
              fi
            done

            COUNT=$(echo "$ENTRIES" | grep -o '"name"' | wc -l)
            if [ "$COUNT" -gt 120 ]; then
              # Too many for a matrix (GitHub caps at 256 jobs); run everything in one job
              FULL="true"
            elif [ "$COUNT" -gt 0 ]; then
              MATRIX="[${ENTRIES%,}]"
              HAS="true"
            fi
          fi

          echo "full_run=$FULL" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_wheels=$HAS" >> "$GITHUB_OUTPUT"

          flag() {
            if [ "$FULL" = "true" ] || echo "$CHANGED" | grep -qE "$1"; then echo true; else echo false; fi
          }
          echo "log_changed=$(flag '^wheels/primitives/log/')" >> "$GITHUB_OUTPUT"
          echo "crc16_changed=$(flag '^wheels/primitives/crc16/')" >> "$GITHUB_OUTPUT"
          echo "examples_changed=$(flag '^examples/|^wheels/')" >> "$GITHUB_OUTPUT"
          echo "wheels_touched=$(flag '^wheels/')" >> "$GITHUB_OUTPUT"

          echo "::notice::full_run=$FULL changed_wheels=$COUNT"

  # ---- Full run: every wheel, one job, parallel ----

  wheel-test-all:
    name: all wheels (host C99, parallel)
    needs: detect-changes
    if: needs.detect-changes.outputs.full-run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Build and test every wheel
        run: bash tooling/test/test_all.sh --parallel

  # ---- Incremental run: only changed wheels and their dependents ----

  wheel-test:
    name: ${{ matrix.name }} wheel (host C99)
    needs: detect-changes
    if: needs.detect-changes.outputs.has-wheels == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.wheel-matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Build
        run: |
          cmake -GNinja -S . -B build
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---- Standalone wheel jobs (C test + pytest) ----

  log-wheel:
    name: log wheel (host C99 + pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.log-changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wheels/primitives/log
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements-ci.txt

      - name: Install pytest
        run: pip install -r ${{ github.workspace }}/tooling/requirements-ci.txt

      - name: Build (C test)
        run: |
          cmake -GNinja -S test -B test/build
          cmake --build test/build

      - name: Run C test
        run: ctest --test-dir test/build --output-on-failure

      - name: Run pytest (includes release build elimination check)
        run: python3 -m pytest test/test_log.py -v

  crc16-wheel:
    name: crc16 wheel (host C99 + pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.crc16-changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wheels/primitives/crc16
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements-ci.txt

      - name: Install pytest
        run: pip install -r ${{ github.workspace }}/tooling/requirements-ci.txt

      - name: Build (C test)
        run: |
          cmake -GNinja -S test -B test/build
          cmake --build test/build

      - name: Run C test
        run: ctest --test-dir test/build --output-on-failure

      - name: Run pytest
        run: python3 -m pytest test/test_crc16.py -v

  # ---- Integration examples ----

  examples-test:
    name: examples (build + run)
    needs: detect-changes
    if: needs.detect-changes.outputs.examples-changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Build and run examples
        run: |
          FAIL=0
          for example in examples/*/; do
            name=$(basename "$example")
            echo "::group::$name"
            if ! cmake -GNinja -S "$example" -B "$example/build" \
                || ! ninja -C "$example/build"; then
              echo "::error::Example $name failed to build"
              FAIL=1
              echo "::endgroup::"
              continue
            fi
            if [ -f "$example/BUILD_ONLY" ]; then
              echo "::notice::Example $name built OK (BUILD_ONLY, skip run)"
            elif "$example/build/$name"; then
              echo "::notice::Example $name passed"
            else
              echo "::error::Example $name failed"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          exit $FAIL

  # ---- ARM cross-compile smoke: every wheel must compile for Cortex-M4 ----

  arm-compile-check:
    name: ARM cross-compile smoke
    needs: detect-changes
    if: needs.detect-changes.outputs.wheels-touched == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc
        uses: ./.github/actions/arm-gcc

      - name: Verify toolchain
        run: arm-none-eabi-gcc --version | head -1

      - name: ARM compile all wheels
        run: bash tooling/audit/arm_size_audit.sh
