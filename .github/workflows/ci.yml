name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wheel-audit:
    name: wheel audit (orphan + WISHLIST drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit wheels
        run: python tooling/scripts/audit_wheels.py

  log-wheel:
    name: log wheel (linux64 sim)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wheels/primitives/log
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libusb-1.0-0-dev libbsd-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Build (debug)
        run: |
          cmake -GNinja -S . -B build
          cmake --build build

      - name: Build (release, LOG_LEVEL_MAX=WARN)
        run: |
          cmake -GNinja -S . -B build_release \
            -DCMAKE_C_FLAGS='-DLOG_LEVEL_MAX=LOG_LEVEL_WARN'
          cmake --build build_release

      - name: Test
        run: python -m pytest test_log.py -v

  crc16-wheel:
    name: crc16 wheel (host C99)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wheels/primitives/crc16
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Build
        run: |
          cmake -GNinja -S . -B build
          cmake --build build

      - name: Test
        run: python -m pytest test_crc16.py -v

  wheel-test:
    name: ${{ matrix.name }} wheel (host C99)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: w25qxx,         dir: wheels/drivers/w25qxx/test }
          - { name: qmi8658a,       dir: wheels/drivers/qmi8658a/test }
          - { name: qmc5883p,       dir: wheels/drivers/qmc5883p/test }
          - { name: xgzp6816d,      dir: wheels/drivers/xgzp6816d/test }
          - { name: gpio_button,    dir: wheels/drivers/gpio_button/test }
          - { name: gpio_led,       dir: wheels/drivers/gpio_led/test }
          - { name: ws2812,         dir: wheels/drivers/ws2812/test }
          - { name: ncp5623_parser, dir: wheels/protocols/ncp5623_parser/test }
          - { name: nmea_parser, dir: wheels/protocols/nmea_parser/test }
          - { name: ota_ab,      dir: wheels/_draft/ota_ab/test }
          - { name: at_command,     dir: wheels/protocols/at_command/test }
          - { name: modbus_rtu,     dir: wheels/protocols/modbus_rtu/test }
          - { name: fal,            dir: wheels/primitives/fal/test }
          - { name: kvs,            dir: wheels/primitives/kvs/test }
          - { name: cli_parser,    dir: wheels/primitives/cli_parser/test }
          - { name: mahony_ahrs,  dir: wheels/primitives/mahony_ahrs/test }
          - { name: mag_cal,     dir: wheels/primitives/mag_cal/test }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Build
        run: |
          cmake -GNinja -S . -B build
          cmake --build build

      - name: Test
        run: ./build/test_${{ matrix.name }}

  flybox-tests:
    name: flybox project tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Build and run mag_cal
        working-directory: projects/flybox/test/mag_cal
        run: |
          cmake -GNinja -S . -B build
          cmake --build build
          ./build/test_mag_cal

  flybox-build:
    name: flybox firmware (gd32f405 cross-compile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Assert GCC ARM major version
        # Soft-pin: don't lock the apt version string (brittle), but fail CI
        # if a runner image upgrade brings in GCC 14+. GCC version directly
        # affects stack frame size, so the stack_analyzer baseline is only
        # comparable across the same major. When this assert fails, recalibrate
        # stack_tasks.flybox.json and bump the version here in the same commit.
        run: |
          set -e
          GCC_VER=$(arm-none-eabi-gcc -dumpversion)
          echo "arm-none-eabi-gcc version: $GCC_VER"
          case "$GCC_VER" in
            13.*) echo "[OK] GCC 13.x as expected" ;;
            *)    echo "[FAIL] expected GCC 13.x, got $GCC_VER — recalibrate stack baseline"; exit 1 ;;
          esac

      - name: Stage GD32 vendor SDK from flybox/third_party
        # The SDK headers live under projects/flybox/third_party/ (tracked) but
        # vsf-addon's drivers reference them via ../common/vendor/Include/.
        # Locally the user copies the SDK into vendor/Include manually
        # (vendor/.gitignore = '*'); CI does the same copy non-interactively.
        #
        # IMPORTANT: copy ONLY the GD32-specific files (gd32f4xx.h, system_gd32f4xx.h,
        # gd32f4xx_*.h peripherals) — NOT the CMSIS 4 core_cm*.h headers from
        # third_party/CMSIS/. gd32f4xx.h does `#include "core_cm4.h"` (quotes,
        # same-dir search). If CMSIS 4 core_cm4.h sits next to it, that wins
        # and pulls in CMSIS 4 core_cmInstr.h / core_cmFunc.h which don't
        # exist anywhere reachable. Locally vendor/Include omits the core files
        # entirely so the same-dir search fails and the include falls through
        # to VSF's bundled CMSIS 5 (utilities/compiler/arm/3rd-party/CMSIS/...).
        run: |
          SDK_DST=vsf-addon/hal/driver/gd/GD32F4XX/common/vendor
          mkdir -p "$SDK_DST/Include"
          cp projects/flybox/third_party/CMSIS/gd32f4xx.h        "$SDK_DST/Include/"
          cp projects/flybox/third_party/CMSIS/system_gd32f4xx.h "$SDK_DST/Include/"
          cp projects/flybox/third_party/gd32_periph/Include/*.h "$SDK_DST/Include/"
          echo "Total headers: $(ls $SDK_DST/Include/ | wc -l)"

      - name: Configure
        run: cmake -GNinja -S projects/flybox/vsf_build -B build

      - name: Build
        run: cmake --build build

      - name: Verify outputs + size
        run: |
          test -f build/flybox_vsf.elf
          test -f build/flybox_vsf.bin
          test -f build/flybox_vsf.hex
          arm-none-eabi-size build/flybox_vsf.elf
          arm-none-eabi-readelf -h build/flybox_vsf.elf | grep -q "ARM"
          echo "ELF header: valid ARM binary"

      - name: Stack analysis (fail on overflow)
        run: |
          python3 tooling/scripts/gd32f4xx_debug/stack_analyzer.py \
            build \
            --task-config tooling/scripts/gd32f4xx_debug/stack_tasks.flybox.json \
            --top 30

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flybox-firmware-${{ github.sha }}
          path: |
            build/flybox_vsf.elf
            build/flybox_vsf.bin
            build/flybox_vsf.hex
          retention-days: 14
