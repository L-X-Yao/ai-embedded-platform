name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Always-run: audit + tooling tests ----

  wheel-audit:
    name: wheel audit (orphan + WISHLIST drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit wheels
        run: python3 tooling/scripts/audit_wheels.py

  # ---- Change detection ----

  detect-changes:
    name: detect changed wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      wheel-matrix: ${{ steps.detect.outputs.matrix }}
      has-wheels: ${{ steps.detect.outputs.has_wheels }}
      harness-changed: ${{ steps.detect.outputs.harness_changed }}
      flybox-changed: ${{ steps.detect.outputs.flybox_changed }}
      log-changed: ${{ steps.detect.outputs.log_changed }}
      crc16-changed: ${{ steps.detect.outputs.crc16_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # Fallback for first push or force-push
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          CHANGED=""
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "")
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null || echo "")
          fi

          # If harness or audit changed, test everything
          HARNESS_CHANGED="false"
          if echo "$CHANGED" | grep -qE "tooling/test/|tooling/scripts/audit"; then
            HARNESS_CHANGED="true"
          fi
          echo "harness_changed=$HARNESS_CHANGED" >> "$GITHUB_OUTPUT"

          # Detect changed wheels → build matrix
          MATRIX="["
          FIRST=true

          for test_cmake in wheels/*/*/test/CMakeLists.txt; do
            wheel_dir=$(dirname "$(dirname "$test_cmake")")
            name=$(basename "$wheel_dir")
            test_dir="${wheel_dir}/test"

            # Skip log and crc16 (standalone jobs with pytest)
            [ "$name" = "log" ] && continue
            [ "$name" = "crc16" ] && continue

            # Include if: harness changed, or wheel files changed, or upstream dep changed, or no BASE (full run)
            INCLUDE=false
            if [ "$HARNESS_CHANGED" = "true" ] || [ -z "$BASE" ]; then
              INCLUDE=true
            elif echo "$CHANGED" | grep -q "^${wheel_dir}/"; then
              INCLUDE=true
            else
              # Auto-detect upstream deps from test/CMakeLists.txt cross-wheel paths
              for upstream in $(grep -oE '\.\./\.\./\.\./(primitives|drivers|protocols|modules)/[a-z0-9_]+' "$test_cmake" 2>/dev/null | sed 's|.*/\.\./\.\./\.\./||' | sort -u); do
                if echo "$CHANGED" | grep -q "^wheels/${upstream}/"; then
                  INCLUDE=true
                  break
                fi
              done
            fi

            if [ "$INCLUDE" = "true" ]; then
              if [ "$FIRST" = "true" ]; then FIRST=false; else MATRIX="$MATRIX,"; fi
              MATRIX="$MATRIX{\"name\":\"$name\",\"dir\":\"$test_dir\"}"
            fi
          done
          MATRIX="$MATRIX]"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "has_wheels=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_wheels=true" >> "$GITHUB_OUTPUT"
          fi

          # Standalone job triggers
          FLYBOX="false"
          if [ "$HARNESS_CHANGED" = "true" ] || [ -z "$BASE" ] || echo "$CHANGED" | grep -qE "^projects/flybox/|^tooling/scripts/gd32f4xx_debug/"; then
            FLYBOX="true"
          fi
          echo "flybox_changed=$FLYBOX" >> "$GITHUB_OUTPUT"

          LOG="false"
          if [ "$HARNESS_CHANGED" = "true" ] || [ -z "$BASE" ] || echo "$CHANGED" | grep -q "^wheels/primitives/log/"; then
            LOG="true"
          fi
          echo "log_changed=$LOG" >> "$GITHUB_OUTPUT"

          CRC16="false"
          if [ "$HARNESS_CHANGED" = "true" ] || [ -z "$BASE" ] || echo "$CHANGED" | grep -q "^wheels/primitives/crc16/"; then
            CRC16="true"
          fi
          echo "crc16_changed=$CRC16" >> "$GITHUB_OUTPUT"

          echo "::notice::Changed wheels: $(echo "$MATRIX" | grep -o '"name"' | wc -l) / harness=$HARNESS_CHANGED"

  # ---- Standalone wheel jobs (special build requirements) ----

  log-wheel:
    name: log wheel (host C99 + pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.log-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wheels/primitives/log
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements-ci.txt

      - name: Install pytest
        run: pip install -r ${{ github.workspace }}/tooling/requirements-ci.txt

      - name: Build (C test)
        run: |
          cmake -GNinja -S test -B test/build
          cmake --build test/build

      - name: Run C test
        run: ctest --test-dir test/build --output-on-failure

      - name: Run pytest (includes release build elimination check)
        run: python3 -m pytest test/test_log.py -v

  crc16-wheel:
    name: crc16 wheel (host C99 + pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.crc16-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wheels/primitives/crc16
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements-ci.txt

      - name: Install pytest
        run: pip install -r ${{ github.workspace }}/tooling/requirements-ci.txt

      - name: Build (C test)
        run: |
          cmake -GNinja -S test -B test/build
          cmake --build test/build

      - name: Run C test
        run: ctest --test-dir test/build --output-on-failure

      - name: Run pytest
        run: python3 -m pytest test/test_crc16.py -v

  # ---- Dynamic wheel test matrix (only changed wheels) ----

  wheel-test:
    name: ${{ matrix.name }} wheel (host C99)
    needs: detect-changes
    if: needs.detect-changes.outputs.has-wheels == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.wheel-matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Build
        run: |
          cmake -GNinja -S . -B build
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---- Project tests ----

  flybox-tests:
    name: flybox project tests (host)
    needs: detect-changes
    if: needs.detect-changes.outputs.flybox-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Build and run mag_cal
        working-directory: projects/flybox/test/mag_cal
        run: |
          cmake -GNinja -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements-ci.txt
      - name: Install pytest
        run: pip install -r ${{ github.workspace }}/tooling/requirements-ci.txt
      - name: Test parse_fault.py
        run: python3 -m pytest tooling/scripts/gd32f4xx_debug/test_parse_fault.py -v

  flybox-build:
    name: flybox firmware (gd32f405 cross-compile)
    needs: detect-changes
    if: needs.detect-changes.outputs.flybox-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCC_ARM_URL: "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz"
    steps:
      - uses: actions/checkout@v5

      - name: Install arm-none-eabi-gcc
        run: |
          wget -q --fail "$GCC_ARM_URL" -O /tmp/gcc-arm.tar.xz
          sudo mkdir -p /opt/gcc-arm
          sudo tar -xf /tmp/gcc-arm.tar.xz -C /opt/gcc-arm --strip-components=1
          echo "/opt/gcc-arm/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Build flybox firmware
        working-directory: projects/flybox/vsf_build
        run: |
          cmake -GNinja -S . -B build
          cmake --build build
