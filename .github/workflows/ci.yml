name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  log-wheel:
    name: log wheel (linux64 sim)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wheels/primitives/log
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libusb-1.0-0-dev libbsd-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Build (debug)
        run: |
          cmake -GNinja -S . -B build
          cmake --build build

      - name: Build (release, LOG_LEVEL_MAX=WARN)
        run: |
          cmake -GNinja -S . -B build_release \
            -DCMAKE_C_FLAGS='-DLOG_LEVEL_MAX=LOG_LEVEL_WARN'
          cmake --build build_release

      - name: Test
        run: python -m pytest test_log.py -v

  flybox-build:
    name: flybox firmware (gd32f405 cross-compile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Stage GD32 vendor SDK from flybox/third_party
        # The SDK headers live under projects/flybox/third_party/ (tracked) but
        # vsf-addon's drivers reference them via ../common/vendor/Include/.
        # Locally the user copies the SDK into vendor/Include manually
        # (vendor/.gitignore = '*'); CI does the same copy non-interactively.
        #
        # IMPORTANT: copy ONLY the GD32-specific files (gd32f4xx.h, system_gd32f4xx.h,
        # gd32f4xx_*.h peripherals) — NOT the CMSIS 4 core_cm*.h headers from
        # third_party/CMSIS/. gd32f4xx.h does `#include "core_cm4.h"` (quotes,
        # same-dir search). If CMSIS 4 core_cm4.h sits next to it, that wins
        # and pulls in CMSIS 4 core_cmInstr.h / core_cmFunc.h which don't
        # exist anywhere reachable. Locally vendor/Include omits the core files
        # entirely so the same-dir search fails and the include falls through
        # to VSF's bundled CMSIS 5 (utilities/compiler/arm/3rd-party/CMSIS/...).
        run: |
          SDK_DST=vsf-addon/hal/driver/gd/GD32F4XX/common/vendor
          mkdir -p "$SDK_DST/Include"
          cp projects/flybox/third_party/CMSIS/gd32f4xx.h        "$SDK_DST/Include/"
          cp projects/flybox/third_party/CMSIS/system_gd32f4xx.h "$SDK_DST/Include/"
          cp projects/flybox/third_party/gd32_periph/Include/*.h "$SDK_DST/Include/"
          echo "Total headers: $(ls $SDK_DST/Include/ | wc -l)"

      - name: Configure
        run: cmake -GNinja -S projects/flybox/vsf_build -B build

      - name: Build
        run: cmake --build build

      - name: Verify outputs + size
        run: |
          test -f build/flybox_vsf.elf
          test -f build/flybox_vsf.bin
          test -f build/flybox_vsf.hex
          arm-none-eabi-size build/flybox_vsf.elf

      - name: Stack analysis (fail on overflow)
        run: |
          python3 tooling/scripts/gd32f4xx_debug/stack_analyzer.py \
            build \
            --task-config tooling/scripts/gd32f4xx_debug/stack_tasks.flybox.json \
            --top 30

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flybox-firmware-${{ github.sha }}
          path: |
            build/flybox_vsf.elf
            build/flybox_vsf.bin
            build/flybox_vsf.hex
          retention-days: 14
