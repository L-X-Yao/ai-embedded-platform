name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz-protocols:
    name: libfuzzer protocol fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install libFuzzer runtime
        run: |
          clang --version | head -1
          MAJOR=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get update -qq && sudo apt-get install -y -qq "libclang-rt-${MAJOR}-dev" || true

      - name: Restore fuzz corpus
        uses: actions/cache/restore@v4
        with:
          path: /tmp/libfuzzer_corpus
          key: libfuzzer-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: libfuzzer-corpus-

      - name: Run libfuzzer (10s per target)
        run: bash tooling/test/run_libfuzzer.sh --time 10

      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/libfuzzer_corpus
          key: libfuzzer-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libfuzzer-crashes-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/libfuzzer_artifacts
          if-no-files-found: ignore

  property-tests:
    name: property tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Run property tests
        run: make test-property

  coverage-gate:
    name: coverage gate (>=80% all wheels)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Coverage scan (parallel, gate)
        run: bash tooling/test/coverage_scan.sh --gate --jobs 4

  arm-size-audit:
    name: ARM size audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi

      - name: Run ARM size audit
        run: bash tooling/audit/arm_size_audit.sh
