name: Install arm-none-eabi-gcc
description: Arm's 13.2.rel1 toolchain, from the cache or from Arm on a cache miss

runs:
  using: composite
  steps:
    - name: Restore the toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/arm-gcc
        key: arm-gnu-toolchain-13.2.rel1-x86_64

    - name: Download the toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        url="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz"
        mkdir -p ~/arm-gcc
        curl -fsSL --retry 3 --retry-delay 5 --max-time 300 "$url" | tar -xJ -C ~/arm-gcc --strip-components=1

    - name: Add the toolchain to PATH
      shell: bash
      run: echo "$HOME/arm-gcc/bin" >> "$GITHUB_PATH"
