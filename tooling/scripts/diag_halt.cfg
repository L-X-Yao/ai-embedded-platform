init
halt

proc rd {name addr} {
    set val [read_memory $addr 32 1]
    echo [format "  %-8s = 0x%08X" $name $val]
}

echo ""
echo "=== Fault status ==="
rd "CFSR"  0xE000ED28
rd "HFSR"  0xE000ED2C
rd "MMFAR" 0xE000ED34
rd "BFAR"  0xE000ED38
rd "SHCSR" 0xE000ED24
rd "ICSR"  0xE000ED04

echo ""
echo "=== System control ==="
rd "VTOR"  0xE000ED08

resume
shutdown
