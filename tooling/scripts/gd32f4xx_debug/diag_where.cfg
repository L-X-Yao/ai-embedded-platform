# OpenOCD one-shot: 3 PC samples 400 ms apart. Useful for "where is the MCU
# stuck?" without a full GDB session. If all 3 PC values are within the same
# function, that's your stuck loop. Run `arm-none-eabi-addr2line -e <elf> <pc>`
# on each value to localize.
#
# Usage:
#   openocd -f interface/cmsis-dap.cfg -f target/stm32f4x.cfg -f diag_where.cfg

init
halt
echo ""
echo "=== PC samples (3 over ~800 ms) ==="
proc sample {} {
    halt
    set pc [reg pc]
    echo "$pc"
    resume
}
sample
sleep 400
halt
echo "PC after 400ms:"
reg pc
resume
sleep 400
halt
echo "PC after 800ms:"
reg pc
resume
shutdown
