init
halt

proc read_reg {name addr} {
    set val [read_memory $addr 32 1]
    echo [format "%s = 0x%08X" $name $val]
}

read_reg "USART0_STAT0" 0x40011000
read_reg "USART0_BRR"   0x40011008
read_reg "USART0_CTL0"  0x4001100C
read_reg "GPIOA_MODER"  0x40020000
read_reg "GPIOA_AFRH"   0x40020024
read_reg "RCU_APB2EN"   0x40023844
read_reg "RCU_CFG0"     0x40023808
read_reg "VTOR"         0xE000ED08

resume
shutdown
