# Generic build/flash/check conf template for build_flash_check.sh.
# Sourced as bash — quote values with spaces; arrays use bash array syntax.
#
# Required keys are marked [REQUIRED]. Everything else has a default.

# ============================================================
# Build artifact
# ============================================================

# [REQUIRED] Absolute or repo-relative path to the .bin to flash.
# OpenOCD reads this directly, so use a path it can resolve from PWD.
BIN_PATH="/path/to/your_project.bin"

# Optional. ELF for size check. Defaults to BIN_PATH with .bin → .elf.
# ELF_PATH="$HOME/build/your_project.elf"

# [REQUIRED] Flash start address (slot or boot address).
FLASH_ADDR="0x08010000"

# ============================================================
# Build (optional — omit BUILD_CMD to skip the build step)
# ============================================================

# Eval'd as a bash command. May invoke wsl, ninja, make, cmake --build, etc.
# BUILD_CMD='wsl -e bash -c "cd ~/build && ninja 2>&1" | tail -5'

# Eval'd after BUILD_CMD. Useful if your build dir is on WSL but BIN_PATH
# points to a Windows-side path.
# COPY_CMD='wsl -e bash -c "cp ~/build/your_project.bin /mnt/c/path/your_project.bin"'

# ============================================================
# Size check (optional — omit SRAM_LIMIT to skip)
# ============================================================

# SRAM_LIMIT="131072"        # bytes; main SRAM only
# CCM_OFFSET="0"             # bytes of CCM RAM that are NOT counted in main SRAM
                              # (GD32F405: 65536 — TCM/CCM is separate from main SRAM)
# SRAM_RESERVE="6144"        # ISR + heap headroom to subtract from "free"

# ============================================================
# OpenOCD adapter / target (defaults work for STM32F4 + GD32F4 via CMSIS-DAP)
# ============================================================

# OCD_INTERFACE="interface/cmsis-dap.cfg"
# OCD_TARGET="target/stm32f4x.cfg"     # Note: works for GD32F4xx (SWD-compatible)
# OCD_SPEED="1000"

# ============================================================
# Serial check
# ============================================================

# [REQUIRED for `check`] COM port for the device's debug UART
SERIAL_PORT="COM25"

# Default: $SCRIPT_DIR/../gd32f4xx_debug/serial_capture.ps1
# Override only if you ship your own capture script.
# SERIAL_CAPTURE_SCRIPT="/path/to/your_capture.ps1"

# Where to write the captured serial log
SERIAL_LOG="/tmp/build_flash_check_serial.log"

# Default capture duration in seconds (overridable via `check NN` arg)
CHECK_DURATION="30"

# ============================================================
# Verdict patterns — bash arrays of ERE regex (used with grep -E)
# ============================================================

# Lines that must NOT appear (any match → FAIL).
FAIL_PATTERNS=(
    "HardFault|BusFault|MemManage|UsageFault"
    "\[WDG\]\[ERROR\]"
)

# Lines that must appear. Score = how many match. Pass needs ≥ MIN_PASSED.
PASS_PATTERNS=(
    "\[BOOT\] init done"
    "\[APP\] task started"
)
MIN_PASSED="2"

# Bonus patterns — printed if found, do not affect verdict.
PASS_PATTERNS_INFO=(
    "\[NET\] connected"
    "\[MQTT\] subscribed"
)
