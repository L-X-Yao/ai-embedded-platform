# Flybox project config for build_flash_check.sh.
# Driven by projects/flybox/scripts/build_flash.sh (thin wrapper).

# Build artifact (Windows path — OpenOCD reads from here)
BIN_PATH="D:/temp/project/ai-embedded-platform/projects/flybox/vsf_build/flybox_vsf.bin"
ELF_PATH="$HOME/flybox_build/flybox_vsf.elf"
FLASH_ADDR="0x08010000"  # slot B

# Build pipeline (WSL native FS build → copy to repo for OpenOCD)
BUILD_CMD='wsl -e bash -c "cd ~/flybox_build && ninja 2>&1" | tail -5'
COPY_CMD='wsl -e bash -c "cp ~/flybox_build/flybox_vsf.bin /mnt/d/temp/project/ai-embedded-platform/projects/flybox/vsf_build/flybox_vsf.bin"'

# GD32F405 SRAM = 128 KB main + 64 KB CCM (TCM)
SRAM_LIMIT="131072"
CCM_OFFSET="65536"
SRAM_RESERVE="6144"  # 4 KB heap + 2 KB ISR stack

# Flash adapter — CMSIS-DAP, GD32F4 via stm32f4x.cfg (SWD compatible)
OCD_INTERFACE="interface/cmsis-dap.cfg"
OCD_TARGET="target/stm32f4x.cfg"
OCD_SPEED="1000"

# Serial check
SERIAL_PORT="COM25"
SERIAL_LOG="D:/temp/flybox_serial.log"
CHECK_DURATION="30"

# Soak tiers (used by tooling/hil/hil_runner.py)
SOAK_QUICK="30"
SOAK_STANDARD="600"
SOAK_STRESS="1800"

# Verdict patterns
FAIL_PATTERNS=(
    "HardFault|BusFault|MemManage|UsageFault"
    "\[WDG\]\[ERROR\]"
)
PASS_PATTERNS=(
    "\[IMU\] OK"
    "\[BARO\] (OK|Retry)"
    "\[LED\] task started"
    "\[SYS\]\[INFO\] Starting NET"
)
MIN_PASSED="3"
PASS_PATTERNS_INFO=(
    "\[NET\]\[INFO\] SIM/network/PDP ready"
    "MQTT Session Established"
)
