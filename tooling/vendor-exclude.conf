# Repo-level vendor/upstream paths that tools should skip.
# One glob pattern per line. Scripts source this file to avoid
# hardcoding the same exclusions in multiple places.
#
# NOTE: .gitattributes has its own syntax and cannot read this file,
# so vsf/** -text must be maintained there separately.
#
# Wheel-level vendor dirs (wheels/*/vendor/) are detected by convention
# (check for vendor/ subdir) and are NOT listed here.

vsf/*
projects/drone_light/Nations*
